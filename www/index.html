<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>简记账</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1d2129;--sub:#86909c;--pri:#2b7de9;--exp:#e5484d;--inc:#2ea66a;--bd:#e5e6eb}
@media(prefers-color-scheme:dark){:root{--bg:#121316;--card:#1d1f24;--tx:#eceef2;--sub:#8b919c;--bd:#2b2e35}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.sum{background:var(--pri);color:#fff;border-radius:16px;padding:16px}
.mon{display:flex;align-items:center;justify-content:center;gap:16px;font-size:15px}
.mon button{background:none;border:0;color:#fff;font-size:20px;padding:4px 10px}
.bal{font-size:34px;font-weight:700;text-align:center;margin:6px 0}
.row2{display:flex;justify-content:space-around;font-size:14px;opacity:.95}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:12px}
.card h3{font-size:14px;color:var(--sub);font-weight:500;margin-bottom:8px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.bar i{display:block;height:8px;border-radius:4px;background:var(--exp);min-width:2px}
.bar span:first-child{width:44px}.bar span:last-child{margin-left:auto}
.day{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin:16px 4px 6px}
.it{display:flex;align-items:center;gap:10px;background:var(--card);padding:12px 14px;border-bottom:1px solid var(--bd)}
.it:first-of-type{border-radius:14px 14px 0 0}.it:last-child{border-radius:0 0 14px 14px;border:0}.it:only-child{border-radius:14px}
.ic{width:38px;height:38px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:20px}
.it .m{flex:1;min-width:0}.it .n{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600}.e{color:var(--exp)}.i{color:var(--inc)}
.del{background:none;border:0;color:var(--sub);font-size:18px;padding:4px 6px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:9}
.mask.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;color:var(--tx);font-size:15px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
#amt{width:100%;font-size:32px;font-weight:700;border:0;border-bottom:2px solid var(--pri);background:none;color:var(--tx);padding:6px 0;outline:0}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.cats button{border:2px solid transparent;background:var(--bg);border-radius:12px;padding:8px 0;color:var(--tx);font-size:12px}
.cats button.on{border-color:var(--pri)}.cats b{display:block;font-size:22px;font-weight:400}
.f{display:flex;gap:8px}.f input{flex:1;min-width:0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font-size:15px}
.ok{width:100%;margin-top:12px;border:0;background:var(--pri);color:#fff;font-size:17px;padding:13px;border-radius:12px}
</style></head><body>
<div class="wrap">
  <div class="sum">
    <div class="mon"><button onclick="mv(-1)">‹</button><span id="mt"></span><button onclick="mv(1)">›</button></div>
    <div class="bal" id="bal"></div>
    <div class="row2"><span>收入 <b id="si"></b></span><span>支出 <b id="se"></b></span></div>
  </div>
  <div class="card" id="rank"></div>
  <div id="list"></div>
</div>
<button class="fab" onclick="openS()">+</button>
<div class="mask" id="mask" onclick="if(event.target===this)closeS()"><div class="sheet">
  <div class="seg"><button id="t0" class="on" onclick="setT(0)">支出</button><button id="t1" onclick="setT(1)">收入</button></div>
  <input id="amt" type="number" inputmode="decimal" placeholder="0.00">
  <div class="cats" id="cats"></div>
  <div class="f"><input id="note" placeholder="备注（可选）"><input id="date" type="date"></div>
  <button class="ok" onclick="save()">保存</button>
</div></div>
<script>
const CE=[["🍜","餐饮"],["🚌","交通"],["🛒","购物"],["🏠","住房"],["🎮","娱乐"],["💊","医疗"],["📚","学习"],["👪","人情"],["📱","通讯"],["📦","其他"]];
const CI=[["💰","工资"],["🧧","红包"],["📈","理财"],["🎁","礼金"],["📦","其他"]];
let data=[],cur=new Date(),type=0,cat=0;
try{data=JSON.parse(localStorage.getItem("ledger")||"[]")}catch(e){}
const persist=()=>{try{localStorage.setItem("ledger",JSON.stringify(data))}catch(e){}};
const $=id=>document.getElementById(id), f=n=>n.toFixed(2);
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function mv(n){cur=new Date(cur.getFullYear(),cur.getMonth()+n,1);render()}
function render(){
  const k=ym(cur),L=data.filter(x=>x.date.startsWith(k)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const inc=L.filter(x=>x.t).reduce((s,x)=>s+x.a,0),exp=L.filter(x=>!x.t).reduce((s,x)=>s+x.a,0);
  $("mt").textContent=cur.getFullYear()+"年"+(cur.getMonth()+1)+"月";
  $("bal").textContent="结余 "+f(inc-exp);$("si").textContent=f(inc);$("se").textContent=f(exp);
  const by={};L.filter(x=>!x.t).forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
  const r=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $("rank").style.display=r.length?"":"none";
  $("rank").innerHTML="<h3>支出分类</h3>"+r.map(([c,v])=>`<div class="bar"><span>${c}</span><i style="width:${v/exp*55}%"></i><span>${f(v)}</span></div>`).join("");
  if(!L.length){$("list").innerHTML='<div class="empty">本月还没有记录<br>点右下角 + 记一笔</div>';return}
  let h="",last="";
  L.forEach(x=>{
    if(x.date!==last){last=x.date;const d=L.filter(y=>y.date===x.date),s=d.reduce((p,y)=>p+(y.t?y.a:-y.a),0);
      h+=`${h?"</div>":""}<div class="day"><span>${x.date.slice(5)}</span><span>${s>=0?"+":""}${f(s)}</span></div><div>`}
    const ic=(x.t?CI:CE).find(z=>z[1]===x.c)?.[0]||"📦";
    h+=`<div class="it"><div class="ic">${ic}</div><div class="m"><div>${x.c}</div>${x.n?`<div class="n">${esc(x.n)}</div>`:""}</div><div class="amt ${x.t?"i":"e"}">${x.t?"+":"-"}${f(x.a)}</div><button class="del" onclick="del(${x.id})">✕</button></div>`;
  });
  $("list").innerHTML=h+"</div>";
}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function del(id){if(confirm("删除这笔记录？")){data=data.filter(x=>x.id!==id);persist();render()}}
function cats(){const C=type?CI:CE;$("cats").innerHTML=C.map((c,i)=>`<button class="${i===cat?"on":""}" onclick="cat=${i};cats()"><b>${c[0]}</b>${c[1]}</button>`).join("")}
function setT(t){type=t;cat=0;$("t0").className=t?"":"on";$("t1").className=t?"on":"";cats()}
function openS(){$("amt").value="";$("note").value="";$("date").value=today();setT(0);$("mask").classList.add("on");setTimeout(()=>$("amt").focus(),100)}
function closeS(){$("mask").classList.remove("on")}
function save(){
  const a=parseFloat($("amt").value);if(!(a>0)){$("amt").focus();return}
  const C=type?CI:CE,d=$("date").value||today();
  data.push({id:Date.now(),t:type,a:Math.round(a*100)/100,c:C[cat][1],n:$("note").value.trim(),date:d});
  persist();closeS();cur=new Date(d.slice(0,4),d.slice(5,7)-1,1);render();
}
render();
</script></body></html>
